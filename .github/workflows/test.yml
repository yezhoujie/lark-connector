name: test

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  node:
    name: node (${{ matrix.os }}, node${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: dist/cli.mjs must match src  # 入仓的 bundle 必须是当前 src 的产物；esbuild 输出跨平台不保证字节一致，只在 ubuntu 比对
        if: runner.os == 'Linux'
        run: git diff --exit-code -- skill/agent-lark/dist/cli.mjs
      - run: npm test
